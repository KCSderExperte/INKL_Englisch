bdetails{margin-top:16px;padding:13px 15px;border-radius:13px;border:1px solid #dee5f3;background:#fafbff}summary{cursor:pointer;font-weight:800}.vocabs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:12px}.vocabrow{display:flex;align-items:center;gap:8px;border:1px solid #e5e9f4;border-radius:9px;background:white;padding:6px 9px}.vocabrow span:first-child{flex:1}.vocabrow span:nth-child(2){font-weight:850;color:#394a9e}.extra-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.extra-item{border:1px solid #dfe4ef;background:#fbfcff;border-radius:15px;padding:14px}.extra-icon{font-size:2.5rem}.palette{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.palettebtn{border:2px solid #dce1e9;background:white;border-radius:11px;display:flex;align-items:center;gap:8px;min-height:49px;padding:7px 11px;font-weight:800}.palettebtn.active{border-color:#435ec8;background:#edf0ff}.swatch{display:inline-block;border:1px solid #0002;width:27px;height:27px;border-radius:8px;flex:none}.paintgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.paintbtn{border:2px solid #e0e4ef;border-radius:15px;background:#fff;padding:9px;min-height:165px;display:flex;flex-direction:column;align-items:center;gap:2px;justify-content:center;font-weight:800}.paintbtn svg{width:95px;height:95px;max-width:100%}.paintbtn.good{border-color:#29915b;background:#eff9f3}.paintbtn.bad{border-color:#c95463;background:#fff1f3}.packlayout{display:grid;grid-template-columns: minmax(210px,.8fr) minmax(0,1.6fr);gap:19px;align-items:start}.bag{background:#eaf0ff;border:2px dashed #abb9e9;border-radius:20px;padding:17px;text-align:center;min-height:280px}.bag-emoji{font-size:6rem;line-height:1.3}.bag-inner{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:57px}.bag-inner span{padding:3px 9px;border-radius:20px;background:white;border:1px solid #cbd5f0;font-size:.95rem}.packitems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.packbtn{border:2px solid #dce4ef;border-radius:12px;background:#fff;min-height:111px;padding:9px;text-align:center;font-weight:800}.packbtn .pic{display:block;font-size:2rem}.packbtn.chosen{border-color:#4a70c7;background:#eaf0ff}.sheetfooter{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:21px;border-top:1px solid var(--line)}.well{background:#eff9f1;border:1px solid #b4dfc2;color:#207043;border-radius:12px;padding:15px;margin:17px 0;font-weight:800}.footerline{text-align:center;color:#7e8aa0;font-size:.81rem;padding:18px}.hidden{display:none!important}

<body>
<div id="app" class="shell"></div>
<script>
'use strict';
// Vier Arbeitsblätter, komplett offline und ohne externe Bibliotheken.
const COLORS={red:'#ec4b55',orange:'#f59c37',yellow:'#f4cd36',green:'#49ac70',blue:'#4287de',brown:'#98633d',black:'#333a49',pink:'#f291bf'};
const DATA=[
{id:'animals',num:1,title:'Animals',emoji:'🐾',subtitle:'Tiere erkennen, zuordnen und ihre Namen üben.',intro:'Schau dir die Bilder genau an. Tippe die passenden englischen Wörter an.',
 vocab:[['Hund','dog','🐶'],['Katze','cat','🐱'],['Fisch','fish','🐟'],['Hamster','hamster','🐹'],['Schildkröte','turtle','🐢'],['Maus','mouse','🐭'],['Schlange','snake','🐍'],['Spinne','spider','🕷️'],['Haustier','pet','🐾'],['Tierarzt / Tierärztin','vet','🩺']],
 quiz:[['🐶','Hund','dog',['dog','cat','mouse']],['🐱','Katze','cat',['hamster','cat','dog']],['🐟','Fisch','fish',['fish','snake','mouse']],['🐹','Hamster','hamster',['hamster','fish','spider']],['🐢','Schildkröte','turtle',['snake','turtle','cat']],['🐭','Maus','mouse',['mouse','hamster','fish']]],
 pairs:[['Schlange','snake'],['Spinne','spider'],['Schildkröte','turtle'],['Fisch','fish'],['Katze','cat'],['Hund','dog']],
 seq:{prompt:'So sehen die Bilder aus. Ordne die englischen Tiernamen genauso an:',icons:['🐢','🐶','🐹','🐟'],answer:['turtle','dog','hamster','fish']},
 memory:[['🐶','dog'],['🐢','turtle'],['🐭','mouse'],['🐱','cat'],['🐟','fish']],special:'letters'},
{id:'colours',num:2,title:'Colours',emoji:'🌈',subtitle:'Farben wiederholen und selbst ausmalen.',intro:'Achte auf die Farben und lies die englischen Wörter.',
 vocab:[['Rot','red',''],['Orange','orange',''],['Gelb','yellow',''],['Grün','green',''],['Blau','blue',''],['Braun','brown',''],['Schwarz','black',''],['Rosa','pink','']],
 quiz:[['red','Rot','red',['red','blue','pink']],['blue','Blau','blue',['brown','blue','green']],['green','Grün','green',['green','yellow','orange']],['yellow','Gelb','yellow',['orange','yellow','red']],['brown','Braun','brown',['black','brown','pink']],['pink','Rosa','pink',['pink','red','orange']]],
 pairs:[['Orange','orange'],['Schwarz','black'],['Grün','green'],['Blau','blue'],['Gelb','yellow'],['Braun','brown']],
 seq:{prompt:'Ordne die Regenbogenfarben: Rot → Orange → Gelb → Grün → Blau.',icons:['red','orange','yellow','green','blue'],answer:['red','orange','yellow','green','blue']},
 memory:[['red','red'],['blue','blue'],['yellow','yellow'],['green','green'],['pink','pink']],special:'paint'},
{id:'family',num:3,title:'Family',emoji:'👨‍👩‍👧‍👦',subtitle:'Familienmitglieder benennen und Sätze bilden.',intro:'Erkenne die Familienmitglieder und verbinde Deutsch mit Englisch.',
 vocab:[['Mutter','mother','👩'],['Vater','father','👨'],['Schwester','sister','👧'],['Bruder','brother','👦'],['Tante','aunt','👩‍🦱'],['Onkel','uncle','👨‍🦱'],['Opa','grandfather','👴'],['Baby','baby','👶'],['Tochter','daughter','👧'],['Sohn','son','👦']],
 quiz:[['👩','Mutter','mother',['mother','sister','aunt']],['👨','Vater','father',['uncle','father','brother']],['👧','Schwester','sister',['sister','mother','baby']],['👦','Bruder','brother',['father','baby','brother']],['👩‍🦱','Tante','aunt',['aunt','sister','mother']],['👨‍🦱','Onkel','uncle',['grandfather','uncle','father']]],
 pairs:[['Opa','grandfather'],['Baby','baby'],['Tochter','daughter'],['Sohn','son'],['Tante','aunt'],['Onkel','uncle']],
 seq:{prompt:'Ordne die englischen Wörter zu den Bildern von links nach rechts:',icons:['👴','👩','👧','👶'],answer:['grandfather','mother','sister','baby']},
 memory:[['Mutter','mother'],['Vater','father'],['Schwester','sister'],['Bruder','brother'],['Tante','aunt']],special:'sentences'},
{id:'school',num:4,title:'School things',emoji:'🎒',subtitle:'Was gehört in meinen Tornister?',intro:'Erkenne deine Schulsachen und packe deinen schoolbag.',
 vocab:[['Tornister / Schulranzen','schoolbag','🎒'],['Bleistift','pencil','✏️'],['Füller / Stift','pen','🖊️'],['Lineal','ruler','📏'],['Schere','scissors','✂️'],['Buch','book','📖'],['Mäppchen','pencil case','🧰'],['Radiergummi','rubber','🧽'],['Kleber','glue','🧴'],['Spitzer','sharpener','🔩'],['Filzstift','felt tip','🖍️'],['Heft','exercise book','📓']],
 quiz:[['🎒','Tornister','schoolbag',['schoolbag','pencil case','book']],['✏️','Bleistift','pencil',['pen','pencil','ruler']],['📏','Lineal','ruler',['ruler','glue','rubber']],['✂️','Schere','scissors',['sharpener','scissors','felt tip']],['📖','Buch','book',['book','exercise book','schoolbag']],['🧴','Kleber','glue',['rubber','glue','pencil case']]],
 pairs:[['Mäppchen','pencil case'],['Radiergummi','rubber'],['Stift','pen'],['Spitzer','sharpener'],['Filzstift','felt tip'],['Heft','exercise book']],
 seq:{prompt:'Packe in dieser Reihenfolge: Buch → Mäppchen → Lineal → Schere → Kleber.',icons:['📖','🧰','📏','✂️','🧴'],answer:['book','pencil case','ruler','scissors','glue']},
 memory:[['🎒','schoolbag'],['✏️','pencil'],['📏','ruler'],['✂️','scissors'],['📖','book']],special:'pack'}
];
const STORAGE_KEY='english_inclusion_ab_4_v3';
const TASK_IDS=['quiz','match','order','memory','special'];
const app=document.querySelector('#app');
function safe(str){return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function load(){try{let s=JSON.parse(localStorage.getItem(STORAGE_KEY));return (s&&typeof s==='object'&&s.version===3)?s:null}catch(_){return null}}
function empty(){return {version:3,name:'',active:0,quiz:{},pairs:{},order:{},memory:{},special:{},checked:{},attempts:{},solutions:{},complete:{}}}
let S=load()||empty();if(!Number.isInteger(S.active)||S.active<0||S.active>3)S.active=0;
let selectedLeft={},messages={},swapSelect={},memoryOpen={},memoryBusy={},drag=null;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S))}catch(_){}}
function getD(){return DATA[S.active]}
function taskKey(id,type){return `${id}.${type}`}
function setDone(id,type,ok){S.complete[taskKey(id,type)]=!!ok}
function isDone(id,type){return !!S.complete[taskKey(id,type)]}
function doneCount(id){return TASK_IDS.filter(t=>isDone(id,t)).length}
function totalDone(){return DATA.reduce((n,d)=>n+doneCount(d.id),0)}
function ensure(d){
 if(!S.quiz[d.id])S.quiz[d.id]={};
 if(!S.pairs[d.id])S.pairs[d.id]={found:[],rightOrder:shuffle(d.pairs.map((_,i)=>i))};
 if(!S.order[d.id]){
   let arr=shuffle(d.seq.answer);if(arr.join('|')===d.seq.answer.join('|'))arr.reverse();
   S.order[d.id]=arr;
 }
 if(!S.memory[d.id]){
   let cards=d.memory.flatMap((p,i)=>[{pair:i,kind:'front',value:p[0]},{pair:i,kind:'back',value:p[1]}]);
   S.memory[d.id]={cards:shuffle(cards),found:[]};
 }
 if(!S.special[d.id])S.special[d.id]={};
}
function getCheck(d,type){return !!S.checked[taskKey(d.id,type)]}
function checkMark(d,type){return `<span class="taskdone ${isDone(d.id,type)?'yes':''}">${isDone(d.id,type)?'✅ Geschafft':'○ Noch offen'}</span>`}
function taskHead(d,type,number,title,hint){return `<div class="taskhead"><h3>${number}. ${title}</h3>${checkMark(d,type)}</div><p class="hint">${hint}</p>`}
function speakButton(english){return `<button type="button" class="speak" title="Wort anhören" aria-label="${safe(english)} anhören" data-action="say" data-text="${safe(english)}">🔊</button>`}
function getIcon(item){if(COLORS[item])return `<span class="swatch" style="width:48px;height:48px;background:${COLORS[item]}"></span>`;return `<span class="qicon">${safe(item)}</span>`}
function renderQuiz(d){
 const answers=S.quiz[d.id];let checked=getCheck(d,'quiz');
 let cards=d.quiz.map((q,i)=>{
   let [icon,de,en,options]=q,chosen=answers[i];
   return `<div class="qcard"><div class="qtitle">${getIcon(icon)}<span class="qword">${safe(de)}</span>${speakButton(en)}</div><div class="choices">${options.map(opt=>{
     const selected=chosen===opt;
     return `<button type="button" class="choice ${selected?'selected':''} ${checked&&selected?(opt===en?'good':'bad'):''}" data-action="answer" data-index="${i}" data-value="${safe(opt)}" aria-pressed="${selected}">${safe(opt)}</button>`
   }).join('')}</div>${checked&&chosen!==en?`<div class="qfeedback">${chosen?'Noch nicht richtig. Versuch es noch mal!':'Wähle ein Wort aus.'}</div>`:''}</div>`
 }).join('');

function checkTask(type){const d=getD(),k=taskKey(d.id,type);S.checked[k]=true;S.attempts[k]=(S.attempts[k]||0)+1;

 if(type==='special'){
   let s=S.special[d.id];
   if(d.special==='letters')ok=SPEC.letters.every((x,i)=>s[i]===x.answer);
   if(d.special==='paint')ok=SPEC.paint.every(x=>(s.paint||{})[x.type]===x.en);
   if(d.special==='sentences')ok=SPEC.sentences.every((x,i)=>s[i]===x.en);

 }

function resetTask(d,type){
 const k=taskKey(d.id,type);
 S.checked[k]=false;S.complete[k]=false;S.attempts[k]=0;S.solutions[k]=false;
 if(type==='match'){S.pairs[d.id]={found:[],rightOrder:shuffle(d.pairs.map((_,i)=>i))};delete selectedLeft[d.id];delete messages[k]}
 if(type==='order'){let order=shuffle(d.seq.answer);if(order.join('|')===d.seq.answer.join('|'))order.reverse();S.order[d.id]=order;delete swapSelect[d.id]}
 if(type==='memory'){delete memoryBusy[d.id];delete memoryOpen[d.id];let cards=d.memory.flatMap((p,i)=>[{pair:i,kind:'front',value:p[0]},{pair:i,kind:'back',value:p[1]}]);S.memory[d.id]={cards:shuffle(cards),found:[]};delete messages[k]}
 render();
}

 opened=[...opened,index];memoryOpen[d.id]=opened;

 else messages[d.id+'.memory']='Die Karten passen noch nicht zusammen. Versuch es erneut!';

 const a=b.dataset.action,d=getD(),id=d.id;

   if(window.confirm('Neues Kind starten? Alle bisherigen Antworten und Punkte auf diesem Gerät werden zurückgesetzt.')){S=empty();selectedLeft={};messages={};swapSelect={};memoryOpen={};memoryBusy={};render();document.getElementById('studentName')?.focus()}

 }

 }

function speak(word){if(!('speechSynthesis'in window)) {alert('Die Vorlesefunktion wird von diesem Browser leider nicht unterstützt.');return}try{window.speechSynthesis.cancel();let utter=new SpeechSynthesisUtterance(word);utter.lang='en-GB';utter.rate=.8;window.speechSynthesis.speak(utter)}catch(_){alert('Das Vorlesen ist auf diesem Gerät gerade nicht verfügbar.')}}
app.addEventListener('click',act);
app.addEventListener('input',e=>{if(e.target.id==='studentName'){S.name=e.target.value;save()}});
// Pointer Events statt HTML5 Drag & Drop: zuverlässig für Finger, Stift und Maus.
app.addEventListener('pointerdown',e=>{
 const handle=e.target.closest('[data-drag-handle]');if(!handle)return;
 const tile=handle.closest('.order-tile'),list=tile?.closest('[data-order-list]');if(!tile||!list)return;
 drag={pointerId:e.pointerId,tile,list,source:getD().id,startY:e.clientY,moved:false};
 handle.setPointerCapture?.(e.pointerId);
 tile.classList.add('dragging');e.preventDefault();
});
app.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.pointerId)return;
 if(Math.abs(e.clientY-drag.startY)>7)drag.moved=true;
 let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.order-tile');
 if(target&&target!==drag.tile&&target.parentElement===drag.list){
   let r=target.getBoundingClientRect();drag.list.insertBefore(drag.tile,e.clientY<r.top+r.height/2?target:target.nextSibling)
 }
 e.preventDefault();
});
function endDrag(e){
 if(!drag||e.pointerId!==drag.pointerId)return;
 let {tile,list,source,moved}=drag;tile.classList.remove('dragging');drag=null;
 if(moved){let newOrder=Array.from(list.querySelectorAll('.order-tile')).map(n=>n.dataset.word);S.order[source]=newOrder;S.checked[taskKey(source,'order')]=false;S.solutions[taskKey(source,'order')]=false;setDone(source,'order',false)}
 render();
}
app.addEventListener('pointerup',endDrag);app.addEventListener('pointercancel',endDrag);
render();
</script>
